name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17, 21]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: graalvm

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and test
        run: mvn verify --batch-mode --no-transfer-progress

      - name: Upload JaCoCo coverage reports
        if: matrix.java-version == 21
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            **/target/site/jacoco/
          retention-days: 14

  format-check:
    name: Code Formatting Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install google-java-format
        run: |
          FORMATTER_VERSION=1.25.2
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/google/google-java-format/releases/download/v${FORMATTER_VERSION}/google-java-format-${FORMATTER_VERSION}-all-deps.jar" \
            -o "$HOME/.local/bin/google-java-format.jar"
          echo '#!/usr/bin/env bash' > "$HOME/.local/bin/google-java-format"
          echo 'exec java -jar "$HOME/.local/bin/google-java-format.jar" "$@"' >> "$HOME/.local/bin/google-java-format"
          chmod +x "$HOME/.local/bin/google-java-format"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: |
          JAVA_FILES=$(find . -name "*.java" -path "*/src/*" -type f)
          if [ -n "$JAVA_FILES" ]; then
            UNFORMATTED=$(java -jar "$HOME/.local/bin/google-java-format.jar" --dry-run --set-exit-if-changed $JAVA_FILES 2>&1 || true)
            if [ -n "$UNFORMATTED" ]; then
              echo "::error::The following files are not formatted correctly:"
              echo "$UNFORMATTED"
              echo ""
              echo "Run 'make format' locally to fix formatting."
              exit 1
            fi
          fi
          echo "All Java files are properly formatted."
